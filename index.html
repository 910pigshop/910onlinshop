<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>910豬式会社線上商店</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Noto Sans TC & Noto Serif JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .font-serif-jp {
            font-family: 'Noto Serif JP', serif;
        }
    </style>
</head>
<body class="bg-[#FAF8F5] text-stone-800 min-h-screen flex flex-col antialiased">

    <!-- 頂部導覽列 (日系優雅暮櫻色) -->
    <header class="bg-[#A85568] text-white shadow-sm sticky top-0 z-40 transition-all">
        <div class="max-w-6xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-bold tracking-wider flex items-center gap-2 font-serif-jp">
                <i class="fa-solid fa-store text-rose-200"></i> <span>910豬式会社線上商店</span>
            </h1>
            <div class="flex items-center gap-2">
                <!-- 新增：官方 LINE 快速按鈕 -->
                <a href="https://lin.ee/YAcEFex" target="_blank" rel="noopener noreferrer" class="text-xs md:text-sm bg-[#06C755] hover:bg-[#05b34c] text-white px-3 py-2 rounded-xl transition flex items-center gap-1.5 font-bold shadow-sm cursor-pointer" title="加入官方 LINE 帳號">
                    <i class="fa-brands fa-line text-base"></i> <span class="hidden sm:inline">官方 LINE</span>
                </a>
                <button onclick="switchFrontView('shop')" id="nav-btn-shop" class="text-xs md:text-sm bg-[#8E4455] hover:bg-[#7D3B4A] px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 font-medium cursor-pointer shadow-sm">
                    <i class="fa-solid fa-bag-shopping"></i> 商品選購
                </button>
                <button onclick="switchFrontView('query')" id="nav-btn-query" class="text-xs md:text-sm bg-white/15 hover:bg-white/25 px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 font-medium cursor-pointer">
                    <i class="fa-solid fa-magnifying-glass"></i> 查詢訂單
                </button>
                <button onclick="openCartModal()" class="relative bg-white/20 hover:bg-white/30 text-white px-3.5 md:px-4 py-2 rounded-xl shadow-sm transition flex items-center gap-2 cursor-pointer border border-white/20">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="hidden md:inline font-medium">購物車</span>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-[#E06A55] text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold shadow-sm">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6">

        <!-- 1. 商品選購頁面 -->
        <div id="front-view-shop" class="space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-stone-200/80 pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-stone-800 font-serif-jp tracking-wide">所有商品</h2>
                    <p class="text-xs md:text-sm text-stone-500 mt-1">選購喜歡的商品，點擊圖片可放大預覽。</p>
                </div>
            </div>

            <!-- 分類標籤導覽列 -->
            <div id="shop-category-tabs" class="flex gap-2 overflow-x-auto pb-2 border-b border-stone-200/60 no-scrollbar">
                <button onclick="filterCategory('all')" class="category-tab px-4 py-2 rounded-xl text-sm font-bold bg-[#A85568] text-white transition whitespace-nowrap cursor-pointer shadow-sm">全部商品</button>
            </div>

            <!-- 商品列表格/卡片 -->
            <div id="shop-product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <div class="col-span-full text-center py-16 text-stone-400 space-y-2">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-[#A85568]"></i>
                    <p class="text-sm">正在載入商品資料...</p>
                </div>
            </div>
        </div>

        <!-- 2. 訂單狀態與包裹重量查詢頁面 -->
        <div id="front-view-query" class="hidden space-y-6">
            <div class="border-b border-stone-200/80 pb-4">
                <h2 class="text-2xl font-bold text-stone-800 font-serif-jp tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-box-open text-[#A85568]"></i> 訂單狀態與包裹重量查詢
                </h2>
                <p class="text-xs md:text-sm text-stone-500 mt-1">請輸入您的訂單編號（如多筆可直接用逗號、空格或換行隔開）：</p>
            </div>
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200/60 space-y-4 max-w-2xl">
                <div class="space-y-2">
                    <label class="block text-sm font-bold text-stone-700">訂單編號</label>
                    <textarea id="query-order-nos" rows="4" placeholder="例如: ORD-20261015-1234, ORD-20261015-5678" class="w-full px-4 py-3 border border-stone-200 rounded-xl focus:ring-2 focus:ring-[#A85568]/40 focus:border-[#A85568] focus:outline-none text-sm bg-[#FAF8F5]/50"></textarea>
                </div>
                <button onclick="queryOrders()" class="bg-[#A85568] hover:bg-[#8E4455] text-white px-6 py-2.5 rounded-xl font-bold text-sm transition flex items-center gap-2 cursor-pointer shadow-sm">
                    <i class="fa-solid fa-magnifying-glass"></i> 開始查詢
                </button>
            </div>

            <div id="query-result-container" class="space-y-3 max-w-2xl"></div>
        </div>

    </main>

    <!-- 購物車與結帳 Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] flex flex-col overflow-hidden border border-stone-100">
            <div class="p-4 border-b border-stone-100 flex justify-between items-center bg-[#FAF8F5]">
                <h3 class="font-bold text-lg text-stone-800 font-serif-jp flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-[#A85568]"></i> 購物車與結帳
                </h3>
                <button onclick="closeCartModal()" class="text-stone-400 hover:text-stone-600 text-2xl font-bold cursor-pointer transition">&times;</button>
            </div>
            <div id="cart-modal-body" class="p-6 overflow-y-auto space-y-4 flex-grow"></div>
        </div>
    </div>

    <!-- 訂單成立成功通知 Modal -->
    <div id="success-modal" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-5 text-center relative border border-stone-100">
            <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto shadow-inner border border-emerald-100">
                <i class="fa-solid fa-check"></i>
            </div>
            <div>
                <h3 class="text-xl font-bold text-stone-800 font-serif-jp">🎉 訂單成立成功！</h3>
                <p class="text-xs text-stone-500 mt-1.5">我們已收到您的訂單資料，感謝您的購買！</p>
            </div>

            <div class="bg-[#FAF8F5] p-4 rounded-2xl border border-stone-200/80 space-y-2.5">
                <div class="text-xs text-stone-500 font-bold">您的訂單編號為</div>
                <div id="success-order-no" class="text-xl font-mono font-bold text-[#A85568] select-all tracking-wider">ORD-XXXXX</div>
                <button onclick="copyOrderNo()" id="copy-btn" class="w-full bg-stone-200/80 hover:bg-stone-300/80 text-stone-700 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 cursor-pointer">
                    <i class="fa-regular fa-copy"></i> <span id="copy-btn-text">一鍵複製訂單編號</span>
                </button>
            </div>

            <!-- 新增：點擊可直接開啟 LINE 傳送連結的提醒區塊 -->
            <div class="bg-emerald-50/90 border border-emerald-200 p-4 rounded-2xl text-left space-y-2">
                <div class="font-bold flex items-center gap-1.5 text-emerald-900 text-sm">
                    <i class="fa-brands fa-line text-xl text-[#06C755]"></i> 【關鍵下一步】回報給官方 LINE
                </div>
                <p class="text-xs text-emerald-800 leading-relaxed">
                    請複製上方訂單編號，並點擊下方按鈕直接開啟官方 LINE 傳送給我們，即可完成對帳與後續進度追蹤！
                </p>
                <a href="https://lin.ee/YAcEFex" target="_blank" rel="noopener noreferrer" class="w-full bg-[#06C755] hover:bg-[#05b34c] text-white py-2.5 rounded-xl font-bold text-xs transition flex items-center justify-center gap-2 shadow-sm cursor-pointer mt-1">
                    <i class="fa-brands fa-line text-lg"></i> 開啟官方 LINE 傳送訂單號
                </a>
            </div>

            <button onclick="closeSuccessModal()" class="w-full bg-stone-200 hover:bg-stone-300 text-stone-700 py-2.5 rounded-xl font-bold transition text-xs cursor-pointer">
                關閉視窗
            </button>
        </div>
    </div>

    <!-- 圖片放大與左右切換懸浮視窗 (Lightbox Modal) -->
    <div id="image-lightbox-modal" class="fixed inset-0 bg-stone-950/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-2 md:p-6 select-none">
        <button onclick="closeImageLightbox()" class="absolute top-4 right-4 text-white/80 hover:text-white bg-white/10 hover:bg-white/20 w-10 h-10 rounded-full flex items-center justify-center text-xl font-bold transition z-10 cursor-pointer">
            &times;
        </button>

        <button onclick="navigateLightbox(-1)" class="absolute left-2 md:left-6 text-white/90 hover:text-white bg-white/10 hover:bg-white/20 w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center text-lg md:text-xl font-bold transition z-10 cursor-pointer shadow-lg">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <button onclick="navigateLightbox(1)" class="absolute right-2 md:right-6 text-white/90 hover:text-white bg-white/10 hover:bg-white/20 w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center text-lg md:text-xl font-bold transition z-10 cursor-pointer shadow-lg">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <div class="max-w-4xl w-full max-h-[85vh] flex flex-col items-center justify-center p-2">
            <img id="lightbox-img" src="" class="max-w-full max-h-[75vh] object-contain rounded-2xl shadow-2xl bg-stone-900/60 p-1 border border-white/10">
            <div id="lightbox-counter" class="text-white/80 text-xs md:text-sm font-bold mt-3 bg-stone-800/80 px-3.5 py-1 rounded-full border border-stone-700">
                1 / 1
            </div>
        </div>
    </div>

    <!-- 前台邏輯與 Firebase 串接 -->
    <script type="module">
        import * as FirebaseApp from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import * as Firestore from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBprY_kKxxx7pPC_7yeyoJw8yacMnpVwMs",
            authDomain: "pigshop.firebaseapp.com",
            projectId: "pigshop",
            storageBucket: "pigshop.firebasestorage.app",
            messagingSenderId: "77868439383",
            appId: "1:77868439383:web:80c696e8863a2cb7c99012",
            measurementId: "G-5Q4R84CS4P"
        };

        const app = FirebaseApp.initializeApp(firebaseConfig);
        const db = Firestore.getFirestore(app);

        let products = [];
        let categories = [];
        let allOrdersCache = [];
        let cart = [];
        let selectedVariants = {};
        let selectedImageIndexes = {};
        let shopQuantities = {};
        let currentCategory = 'all';
        let currentCheckoutStep = 1;
        let createdOrderNo = '';

        let currentLightboxImages = [];
        let currentLightboxIndex = 0;

        let bankAccounts = [{ name: "中國信託 (822)", account: "1234-5678-9012" }];
        let selectedBankIndex = 0;

        const FALLBACK_IMAGE = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 24 24' fill='none' stroke='%23cbd5e1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='18' height='18' x='3' y='3' rx='2' ry='2'/%3E%3Ccircle cx='9' cy='9' r='2'/%3E%3Cpath d='m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21'/%3E%3C/svg%3E";

        Firestore.onSnapshot(Firestore.collection(db, "categories"), (snapshot) => {
            categories = [];
            snapshot.forEach((d) => categories.push({ id: d.id, ...d.data() }));
            renderShopCategoryTabs();
        });

        Firestore.onSnapshot(Firestore.collection(db, "products"), (snapshot) => {
            products = [];
            snapshot.forEach((d) => {
                const data = d.data();
                if (!data.variants || data.variants.length === 0) {
                    data.variants = [{ name: '標準規格', costJPY: data.costJPY || 0, price: data.price || 0, stock: data.stock || 0 }];
                }

                let images = [];
                if (Array.isArray(data.images) && data.images.length > 0) {
                    images = data.images.filter(img => img && img.trim() !== "");
                } else if (data.image && data.image.trim() !== "") {
                    images = [data.image.trim()];
                }
                data.images = images;

                products.push({ id: d.id, ...data });
                if (selectedVariants[d.id] === undefined) selectedVariants[d.id] = 0;
                if (selectedImageIndexes[d.id] === undefined) selectedImageIndexes[d.id] = 0;
                if (shopQuantities[d.id] === undefined) shopQuantities[d.id] = 1;
            });
            renderShopProducts();
        });

        Firestore.onSnapshot(Firestore.collection(db, "orders"), (snapshot) => {
            allOrdersCache = [];
            snapshot.forEach((d) => allOrdersCache.push({ id: d.id, ...d.data() }));
        });

        Firestore.onSnapshot(Firestore.doc(db, "settings", "bank"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.accounts && data.accounts.length > 0) {
                    bankAccounts = data.accounts;
                } else if (data.name && data.account) {
                    bankAccounts = [{ name: data.name, account: data.account }];
                }
            }
        });

        window.switchFrontView = function(viewName) {
            const shopView = document.getElementById('front-view-shop');
            const queryView = document.getElementById('front-view-query');
            const btnShop = document.getElementById('nav-btn-shop');
            const btnQuery = document.getElementById('nav-btn-query');

            if (viewName === 'shop') {
                shopView.classList.remove('hidden');
                queryView.classList.add('hidden');
                btnShop.className = "text-xs md:text-sm bg-[#8E4455] hover:bg-[#7D3B4A] px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 font-medium cursor-pointer shadow-sm";
                btnQuery.className = "text-xs md:text-sm bg-white/15 hover:bg-white/25 px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 font-medium cursor-pointer";
            } else {
                shopView.classList.add('hidden');
                queryView.classList.remove('hidden');
                btnShop.className = "text-xs md:text-sm bg-white/15 hover:bg-white/25 px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 font-medium cursor-pointer";
                btnQuery.className = "text-xs md:text-sm bg-[#8E4455] hover:bg-[#7D3B4A] px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 font-medium cursor-pointer shadow-sm";
            }
        };

        window.filterCategory = function(catName) {
            currentCategory = catName;
            renderShopCategoryTabs();
            renderShopProducts();
        };

        function renderShopCategoryTabs() {
            const container = document.getElementById('shop-category-tabs');
            let html = '<button onclick="window.filterCategory(\'all\')" class="px-4 py-2 rounded-xl text-sm font-bold transition whitespace-nowrap cursor-pointer ' + (currentCategory === 'all' ? 'bg-[#A85568] text-white shadow-sm' : 'bg-stone-200/60 text-stone-600 hover:bg-stone-200') + '">全部商品</button>';
            categories.forEach(c => {
                const isActive = currentCategory === c.name;
                html += '<button onclick="window.filterCategory(\'' + c.name + '\')" class="px-4 py-2 rounded-xl text-sm font-bold transition whitespace-nowrap cursor-pointer ' + (isActive ? 'bg-[#A85568] text-white shadow-sm' : 'bg-stone-200/60 text-stone-600 hover:bg-stone-200') + '">' + c.name + '</button>';
            });
            container.innerHTML = html;
        }

        window.switchProductImage = function(productId, imgIndex) {
            selectedImageIndexes[productId] = Number(imgIndex);
            renderShopProducts();
        };

        window.openImageLightbox = function(productId) {
            const p = products.find(prod => prod.id === productId);
            if (!p || !p.images || p.images.length === 0) return;

            currentLightboxImages = p.images;
            currentLightboxIndex = selectedImageIndexes[productId] !== undefined ? selectedImageIndexes[productId] : 0;
            updateLightboxDisplay();

            document.getElementById('image-lightbox-modal').classList.remove('hidden');
        };

        window.closeImageLightbox = function() {
            document.getElementById('image-lightbox-modal').classList.add('hidden');
        };

        window.navigateLightbox = function(direction) {
            if (currentLightboxImages.length === 0) return;
            currentLightboxIndex = (currentLightboxIndex + direction + currentLightboxImages.length) % currentLightboxImages.length;
            updateLightboxDisplay();
        };

        function updateLightboxDisplay() {
            document.getElementById('lightbox-img').src = currentLightboxImages[currentLightboxIndex] || FALLBACK_IMAGE;
            document.getElementById('lightbox-counter').textContent = (currentLightboxIndex + 1) + ' / ' + currentLightboxImages.length;
        }

        window.changeVariant = function(productId, variantIndex) {
            selectedVariants[productId] = Number(variantIndex);
            shopQuantities[productId] = 1;
            renderShopProducts();
        };

        window.changeShopQty = function(productId, delta) {
            const prod = products.find(p => p.id === productId);
            if (!prod) return;
            const vIdx = selectedVariants[productId] || 0;
            const currentVar = prod.variants[vIdx];
            let current = shopQuantities[productId] || 1;
            let next = current + delta;
            if (next >= 1 && next <= currentVar.stock) {
                shopQuantities[productId] = next;
                document.getElementById('shop-qty-' + productId).textContent = next;
            }
        };

        window.addToCartFromShop = function(productId) {
            const prod = products.find(p => p.id === productId);
            if (!prod) return;
            const vIdx = selectedVariants[productId] || 0;
            const variant = prod.variants[vIdx];
            if (!variant || variant.stock <= 0) return;

            const qty = shopQuantities[productId] || 1;
            const imgIdx = selectedImageIndexes[productId] || 0;
            const imgSrc = (prod.images && prod.images[imgIdx]) ? prod.images[imgIdx] : FALLBACK_IMAGE;

            const cartItemId = prod.id + '_' + vIdx;
            const existing = cart.find(item => item.cartItemId === cartItemId);

            if (existing) {
                if (existing.quantity + qty <= variant.stock) {
                    existing.quantity += qty;
                } else {
                    existing.quantity = variant.stock;
                    alert('已達該規格最大庫存數量限制');
                }
            } else {
                cart.push({
                    cartItemId,
                    id: prod.id,
                    variantIndex: vIdx,
                    name: prod.name,
                    variantName: variant.name,
                    price: variant.price,
                    costJPY: variant.costJPY || 0,
                    quantity: qty,
                    maxStock: variant.stock,
                    image: imgSrc
                });
            }
            updateCartBadge();
            alert('已將【' + prod.name + ' - ' + variant.name + '】x ' + qty + ' 加入購物車！');
        };

        function updateCartBadge() {
            document.getElementById('cart-badge').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
        }

        window.renderShopProducts = function() {
            const grid = document.getElementById('shop-product-grid');
            let filtered = products;
            if (currentCategory !== 'all') {
                filtered = products.filter(p => p.category === currentCategory);
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-16 text-stone-400">此分類目前尚無商品。</div>';
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const images = (p.images && p.images.length > 0) ? p.images : [FALLBACK_IMAGE];
                const activeImgIdx = selectedImageIndexes[p.id] !== undefined && selectedImageIndexes[p.id] < images.length ? selectedImageIndexes[p.id] : 0;
                const currentImgSrc = images[activeImgIdx];

                const vIdx = selectedVariants[p.id] || 0;
                const currentVar = p.variants[vIdx] || p.variants[0];
                const currentQty = shopQuantities[p.id] || 1;

                let thumbnailsHtml = '';
                if (images.length > 1) {
                    thumbnailsHtml = '<div class="flex justify-center items-center gap-1.5 p-2 bg-[#FAF8F5] border-t border-stone-100 overflow-x-auto no-scrollbar">' +
                        images.map((img, idx) => 
                            '<button onclick="window.switchProductImage(\'' + p.id + '\', ' + idx + ')" class="w-7 h-7 rounded-lg overflow-hidden border-2 transition cursor-pointer ' + (idx === activeImgIdx ? 'border-[#A85568] scale-105 shadow-sm' : 'border-transparent opacity-60 hover:opacity-100') + '">' +
                                '<img src="' + img + '" class="w-full h-full object-cover">' +
                            '</button>'
                        ).join('') +
                    '</div>';
                }

                return '<div class="bg-white rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 border border-stone-200/60 overflow-hidden flex flex-col justify-between group">' +
                    '<div>' +
                        '<div onclick="window.openImageLightbox(\'' + p.id + '\')" class="h-56 bg-[#FAF8F5] overflow-hidden relative flex items-center justify-center cursor-zoom-in p-2" title="點擊放大檢視大圖/尺寸表">' +
                            '<img src="' + currentImgSrc + '" alt="' + p.name + '" class="max-w-full max-h-full object-contain transition-transform duration-300 group-hover:scale-105">' +
                            '<div class="absolute bottom-2 right-2 bg-stone-900/50 text-white text-[10px] px-2 py-0.5 rounded-md flex items-center gap-1 opacity-75 group-hover:opacity-100 transition">' +
                                '<i class="fa-solid fa-magnifying-glass-plus"></i> 點擊放大' +
                            '</div>' +
                            (currentVar.stock === 0 ? '<div class="absolute inset-0 bg-stone-900/40 backdrop-blur-[1px] flex items-center justify-center text-white font-bold text-base">此規格已售完</div>' : '') +
                        '</div>' +
                        thumbnailsHtml +
                        '<div class="p-4 space-y-2.5">' +
                            '<span class="text-[11px] bg-[#FAF2F3] text-[#A85568] px-2.5 py-0.5 rounded-md font-bold tracking-wide">' + (p.category || '未分類') + '</span>' +
                            '<h3 class="font-bold text-stone-800 text-base mt-1 line-clamp-2 leading-snug">' + p.name + '</h3>' +
                            '<div>' +
                                '<label class="block text-[11px] font-bold text-stone-500 mb-1">選擇款式 / 規格：</label>' +
                                '<select onchange="window.changeVariant(\'' + p.id + '\', this.value)" class="w-full px-2.5 py-1.5 border border-stone-200 rounded-xl text-xs bg-[#FAF8F5] focus:ring-1 focus:ring-[#A85568] focus:border-[#A85568] focus:outline-none text-stone-700 font-medium">' +
                                    p.variants.map((v, i) => '<option value="' + i + '" ' + (i === vIdx ? 'selected' : '') + '>' + v.name + ' (庫存:' + v.stock + ')</option>').join('') +
                                '</select>' +
                            '</div>' +
                            '<div class="text-[#E06A55] font-bold text-lg">NT$ ' + currentVar.price.toLocaleString() + '</div>' +
                            '<div class="text-[11px] text-stone-400">規格庫存: ' + currentVar.stock + ' 件</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="p-4 pt-0 space-y-3">' +
                        (currentVar.stock > 0 ? 
                            '<div class="flex items-center justify-between bg-[#FAF8F5] p-1.5 rounded-xl border border-stone-200/60">' +
                                '<span class="text-xs text-stone-600 font-medium pl-1">數量</span>' +
                                '<div class="flex items-center gap-2">' +
                                    '<button onclick="window.changeShopQty(\'' + p.id + '\', -1)" class="w-7 h-7 bg-white border border-stone-200 rounded-lg font-bold text-stone-600 shadow-sm hover:bg-stone-100 cursor-pointer transition">-</button>' +
                                    '<span id="shop-qty-' + p.id + '" class="text-sm font-bold w-6 text-center text-stone-800">' + currentQty + '</span>' +
                                    '<button onclick="window.changeShopQty(\'' + p.id + '\', 1)" class="w-7 h-7 bg-white border border-stone-200 rounded-lg font-bold text-stone-600 shadow-sm hover:bg-stone-100 cursor-pointer transition">+</button>' +
                                '</div>' +
                            '</div>' +
                            '<button onclick="window.addToCartFromShop(\'' + p.id + '\')" class="w-full bg-[#A85568] hover:bg-[#8E4455] text-white py-2.5 rounded-xl text-sm font-bold transition cursor-pointer shadow-sm">加入購物車</button>'
                            : '<button disabled class="w-full bg-stone-200 text-stone-400 py-2.5 rounded-xl text-sm font-bold cursor-not-allowed">規格售完</button>'
                        ) +
                    '</div>' +
                '</div>';
            }).join('');
        };

        window.queryOrders = function() {
            const rawInput = document.getElementById('query-order-nos').value;
            const container = document.getElementById('query-result-container');
            if (!rawInput.trim()) {
                container.innerHTML = '<div class="text-sm text-rose-600 bg-white p-4 rounded-xl border border-rose-100">請先輸入至少一筆訂單編號。</div>';
                return;
            }

            const searchNos = rawInput.split(/[\n,\s]+/).map(s => s.trim()).filter(s => s.length > 0);
            const foundOrders = allOrdersCache.filter(o => searchNos.includes(o.orderNo));

            if (foundOrders.length === 0) {
                container.innerHTML = '<div class="text-sm text-stone-500 bg-white p-4 rounded-xl border border-stone-200/60">查無符合的訂單資料，請確認訂單編號是否正確。</div>';
                return;
            }

            container.innerHTML = '<div class="space-y-3">' +
                '<div class="text-xs font-bold text-stone-600">查詢結果共找到 ' + foundOrders.length + ' 筆訂單：</div>' +
                '<div class="divide-y border border-stone-200/80 rounded-2xl overflow-hidden bg-white shadow-sm">' +
                    foundOrders.map(o => 
                        '<div class="p-4 space-y-2">' +
                            '<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-1">' +
                                '<div>' +
                                    '<span class="font-bold text-[#A85568] text-base">' + o.orderNo + '</span>' +
                                    '<span class="text-xs text-stone-400 ml-2">' + new Date(o.createdAt).toLocaleString() + '</span>' +
                                '</div>' +
                                '<span class="text-xs px-3 py-1 rounded-full font-bold bg-[#FAF2F3] text-[#A85568] border border-rose-100">' + o.status + '</span>' +
                            '</div>' +
                            '<div class="text-xs text-stone-600 space-y-1">' +
                                '<div><strong>購買內容：</strong> ' + o.items.map(i => i.name + ' (' + i.variantName + ') x ' + i.quantity).join(', ') + '</div>' +
                                '<div><strong>總金額：</strong> NT$ ' + o.totalAmount.toLocaleString() + '</div>' +
                                '<div><strong>包裹重量：</strong> <span class="text-[#A85568] font-bold text-sm">' + (o.weight !== undefined && o.weight !== '' ? o.weight + ' kg' : '尚未測量/登錄') + '</span></div>' +
                            '</div>' +
                        '</div>'
                    ).join('') +
                '</div>' +
            '</div>';
        };

        window.openCartModal = function() {
            currentCheckoutStep = 1;
            selectedBankIndex = 0;
            renderCartModalContent();
            document.getElementById('cart-modal').classList.remove('hidden');
        };

        window.closeCartModal = function() {
            document.getElementById('cart-modal').classList.add('hidden');
        };

        window.goToCheckoutStep2 = function() {
            currentCheckoutStep = 2;
            renderCartModalContent();
        };

        window.goToCheckoutStep1 = function() {
            currentCheckoutStep = 1;
            renderCartModalContent();
        };

        window.onBankSelectChange = function(index) {
            selectedBankIndex = Number(index);
            const currentAccount = bankAccounts[selectedBankIndex] || bankAccounts[0];
            const displayEl = document.getElementById('checkout-bank-account-display');
            if (displayEl) {
                displayEl.textContent = currentAccount.account;
            }
        };

        window.renderCartModalContent = function() {
            const body = document.getElementById('cart-modal-body');
            if (cart.length === 0) {
                body.innerHTML = '<div class="text-center py-12 text-stone-400 space-y-3">' +
                    '<i class="fa-solid fa-cart-shopping text-4xl text-stone-300"></i>' +
                    '<p class="text-sm">您的購物車是空的</p>' +
                    '<button onclick="closeCartModal()" class="px-5 py-2 bg-[#A85568] text-white rounded-xl text-sm font-bold cursor-pointer hover:bg-[#8E4455] transition">返回選購</button>' +
                '</div>';
                return;
            }

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            if (currentCheckoutStep === 1) {
                body.innerHTML = '<div class="space-y-4">' +
                    '<div class="divide-y divide-stone-100 max-h-60 overflow-y-auto">' +
                        cart.map(item => 
                            '<div class="py-3 flex items-center justify-between gap-3">' +
                                '<img src="' + item.image + '" class="w-12 h-12 rounded-xl object-cover bg-stone-100 border border-stone-200/60">' +
                                '<div class="flex-grow">' +
                                    '<div class="font-bold text-sm text-stone-800">' + item.name + '</div>' +
                                    '<div class="text-xs text-[#A85568] font-medium">規格: ' + item.variantName + '</div>' +
                                    '<div class="text-xs text-stone-400">NT$ ' + item.price.toLocaleString() + ' x ' + item.quantity + '</div>' +
                                '</div>' +
                                '<div class="text-sm font-bold text-stone-900">NT$ ' + (item.price * item.quantity).toLocaleString() + '</div>' +
                                '<button onclick="window.removeFromCart(\'' + item.cartItemId + '\')" class="text-rose-400 hover:text-rose-600 p-1 cursor-pointer transition"><i class="fa-solid fa-trash-can"></i></button>' +
                            '</div>'
                        ).join('') +
                    '</div>' +
                    '<div class="border-t border-stone-100 pt-4 flex justify-between items-center font-bold text-lg">' +
                        '<span class="text-stone-700">總金額：</span>' +
                        '<span class="text-[#E06A55]">NT$ ' + totalAmount.toLocaleString() + '</span>' +
                    '</div>' +
                    '<button type="button" onclick="window.goToCheckoutStep2()" class="w-full bg-[#A85568] text-white py-3 rounded-xl font-bold hover:bg-[#8E4455] transition cursor-pointer shadow-sm">前往填寫匯款資訊</button>' +
                '</div>';
            } else if (currentCheckoutStep === 2) {
                const defaultBank = bankAccounts[selectedBankIndex] || bankAccounts[0];

                body.innerHTML = '<form onsubmit="window.submitOrder(event)" class="space-y-4">' +
                    '<div class="bg-[#FAF2F3] p-4 rounded-2xl text-sm space-y-2 text-[#7D3B4A] border border-rose-100">' +
                        '<div class="font-bold flex items-center gap-1.5"><i class="fa-solid fa-circle-info"></i> 匯款指示與注意事項</div>' +
                        '<p class="text-xs text-stone-600">請選取欲轉入的銀行，將款項匯至指定帳號並完成回報：</p>' +
                        '<div class="bg-white p-3 rounded-xl border border-rose-100 space-y-1.5">' +
                            '<div class="text-xs"><strong>收款帳號：</strong> <span id="checkout-bank-account-display" class="font-bold text-[#A85568] text-sm">' + defaultBank.account + '</span></div>' +
                            '<div class="text-xs"><strong>應付總金額：</strong> <span class="text-[#E06A55] font-bold text-sm">NT$ ' + totalAmount.toLocaleString() + '</span></div>' +
                        '</div>' +
                        '<div class="bg-amber-50/80 border border-amber-200/80 p-2.5 rounded-xl text-amber-900 text-xs leading-relaxed flex gap-2 items-start mt-2">' +
                            '<i class="fa-brands fa-line text-[#06C755] text-base flex-shrink-0 mt-0.5"></i>' +
                            '<div><strong>重要提醒：</strong>訂單送出後，請將「訂單編號」傳送至我們的<strong>官方 LINE</strong>，以方便快速為您對帳與回覆包裹狀況！</div>' +
                        '</div>' +
                    '</div>' +
                    '<div>' +
                        '<label class="block text-xs font-bold text-stone-600 mb-1">選擇轉入銀行帳號</label>' +
                        '<select id="pay-bank-select" onchange="window.onBankSelectChange(this.value)" required class="w-full px-3 py-2 border border-stone-200 rounded-xl focus:ring-1 focus:ring-[#A85568] focus:outline-none text-xs bg-[#FAF8F5]">' +
                            bankAccounts.map((b, i) => '<option value="' + i + '" ' + (i === selectedBankIndex ? 'selected' : '') + '>' + b.name + '</option>').join('') +
                        '</select>' +
                    '</div>' +
                    '<div>' +
                        '<label class="block text-xs font-bold text-stone-600 mb-1">匯款金額 (NT$)</label>' +
                        '<input type="number" id="pay-amount" value="' + totalAmount + '" required class="w-full px-3 py-2 border border-stone-200 rounded-xl focus:ring-1 focus:ring-[#A85568] focus:outline-none text-xs bg-[#FAF8F5] font-bold text-stone-800">' +
                    '</div>' +
                    '<div>' +
                        '<label class="block text-xs font-bold text-stone-600 mb-1">匯款時間</label>' +
                        '<input type="datetime-local" id="pay-time" required class="w-full px-3 py-2 border border-stone-200 rounded-xl focus:ring-1 focus:ring-[#A85568] focus:outline-none text-xs bg-[#FAF8F5] text-stone-700">' +
                    '</div>' +
                    '<div>' +
                        '<label class="block text-xs font-bold text-stone-600 mb-1">帳號後五碼 / 匯款人姓名</label>' +
                        '<input type="text" id="pay-account-suffix" placeholder="例如: 54321 / 王小明" required class="w-full px-3 py-2 border border-stone-200 rounded-xl focus:ring-1 focus:ring-[#A85568] focus:outline-none text-xs bg-[#FAF8F5]">' +
                    '</div>' +
                    '<div class="flex gap-2 pt-2">' +
                        '<button type="button" onclick="window.goToCheckoutStep1()" class="w-1/3 bg-stone-100 text-stone-600 py-2.5 rounded-xl font-bold hover:bg-stone-200 text-xs transition cursor-pointer">回上一步</button>' +
                        '<button type="submit" class="w-2/3 bg-[#A85568] text-white py-2.5 rounded-xl font-bold hover:bg-[#8E4455] text-xs transition cursor-pointer shadow-sm">確認送出訂單</button>' +
                    '</div>' +
                '</form>';
            }
        };

        window.removeFromCart = function(cartItemId) {
            cart = cart.filter(i => i.cartItemId !== cartItemId);
            updateCartBadge();
            renderCartModalContent();
        };

        window.copyOrderNo = function() {
            if (!createdOrderNo) return;
            navigator.clipboard.writeText(createdOrderNo).then(() => {
                const btnText = document.getElementById('copy-btn-text');
                const btn = document.getElementById('copy-btn');
                btnText.textContent = '已複製成功！';
                btn.classList.remove('bg-stone-200/80', 'text-stone-700');
                btn.classList.add('bg-emerald-600', 'text-white');
                
                setTimeout(() => {
                    btnText.textContent = '一鍵複製訂單編號';
                    btn.classList.remove('bg-emerald-600', 'text-white');
                    btn.classList.add('bg-stone-200/80', 'text-stone-700');
                }, 2000);
            }).catch(err => {
                alert('複製失敗，請手動選取複製：' + createdOrderNo);
            });
        };

        window.closeSuccessModal = function() {
            document.getElementById('success-modal').classList.add('hidden');
        };

        window.submitOrder = async function(e) {
            e.preventDefault();
            const bankIdx = Number(document.getElementById('pay-bank-select').value);
            const selectedBank = bankAccounts[bankIdx] || bankAccounts[0];

            const amount = document.getElementById('pay-amount').value;
            const time = document.getElementById('pay-time').value;
            const suffix = document.getElementById('pay-account-suffix').value;

            const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const randomCode = Math.floor(1000 + Math.random() * 9000);
            const orderNo = 'ORD-' + dateStr + '-' + randomCode;
            createdOrderNo = orderNo;
            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const orderData = {
                orderNo,
                createdAt: new Date().toISOString(),
                items: cart,
                totalAmount,
                payment: { 
                    bank: selectedBank.name, 
                    bankAccount: selectedBank.account, 
                    amount: Number(amount), 
                    time, 
                    suffix 
                },
                status: '待查帳',
                weight: ''
            };

            try {
                await Firestore.addDoc(Firestore.collection(db, "orders"), orderData);

                for (const item of cart) {
                    const prod = products.find(p => p.id === item.id);
                    if (prod && prod.variants && prod.variants[item.variantIndex]) {
                        const updatedVariants = [...prod.variants];
                        updatedVariants[item.variantIndex].stock = Math.max(0, updatedVariants[item.variantIndex].stock - item.quantity);
                        await Firestore.updateDoc(Firestore.doc(db, "products", prod.id), { variants: updatedVariants });
                    }
                }

                cart = [];
                updateCartBadge();
                closeCartModal();

                document.getElementById('success-order-no').textContent = orderNo;
                document.getElementById('success-modal').classList.remove('hidden');

            } catch (err) {
                console.error("訂單送出失敗:", err);
                alert("送出訂單發生錯誤，請稍後再試。");
            }
        };
    </script>
</body>
</html>
