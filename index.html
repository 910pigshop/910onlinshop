<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上商店系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-store"></i> <span>線上商店系統</span>
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="switchFrontView('shop')" id="nav-btn-shop" class="text-xs md:text-sm bg-indigo-700 px-3 py-2 rounded-xl transition flex items-center gap-1.5 font-medium cursor-pointer">
                    <i class="fa-solid fa-bag-shopping"></i> 商品選購
                </button>
                <button onclick="switchFrontView('query')" id="nav-btn-query" class="text-xs md:text-sm bg-indigo-800/60 hover:bg-indigo-700 px-3 py-2 rounded-xl transition flex items-center gap-1.5 font-medium cursor-pointer">
                    <i class="fa-solid fa-magnifying-glass"></i> 查訂單與重量
                </button>
                <button onclick="openCartModal()" class="relative bg-indigo-700 hover:bg-indigo-800 text-white px-3 md:px-4 py-2 rounded-xl shadow transition flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="hidden md:inline">購物車</span>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-rose-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6">

        <!-- 1. 商品選購頁面 -->
        <div id="front-view-shop" class="space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900">熱賣商品專區</h2>
                    <p class="text-sm text-slate-500">歡迎選購，點擊圖片可放大查看並左右切換多張大圖。</p>
                </div>
            </div>

            <!-- 分類標籤導覽列 -->
            <div id="shop-category-tabs" class="flex gap-2 overflow-x-auto pb-2 border-b border-slate-200">
                <button onclick="filterCategory('all')" class="category-tab px-4 py-2 rounded-xl text-sm font-bold bg-indigo-600 text-white transition whitespace-nowrap cursor-pointer">全部商品</button>
            </div>

            <!-- 商品列表格/卡片 -->
            <div id="shop-product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <div class="col-span-full text-center py-12 text-slate-400">
                    <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
                    <p>正在載入雲端商品資料...</p>
                </div>
            </div>
        </div>

        <!-- 2. 訂單狀態與包裹重量查詢頁面 -->
        <div id="front-view-query" class="hidden space-y-6">
            <div class="border-b pb-4">
                <h2 class="text-2xl font-bold text-slate-900"><i class="fa-solid fa-box-open text-indigo-600"></i> 訂單狀態與包裹重量查詢</h2>
                <p class="text-sm text-slate-500 mt-1">請輸入您的訂單流水號（如多筆可直接用逗號、空格或換行隔開查詢）：</p>
            </div>
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4 max-w-2xl">
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-slate-700">訂單流水號</label>
                    <textarea id="query-order-nos" rows="4" placeholder="例如: ORD-20261015-1234, ORD-20261015-5678" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm"></textarea>
                </div>
                <button onclick="queryOrders()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl font-medium text-sm transition flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-magnifying-glass"></i> 開始查詢
                </button>
            </div>

            <div id="query-result-container" class="space-y-3 max-w-2xl"></div>
        </div>

    </main>

    <!-- 購物車與結帳 Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-lg text-slate-900"><i class="fa-solid fa-cart-shopping text-indigo-600"></i> 購物車與結帳</h3>
                <button onclick="closeCartModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold cursor-pointer">&times;</button>
            </div>
            <div id="cart-modal-body" class="p-6 overflow-y-auto space-y-4 flex-grow"></div>
        </div>
    </div>

    <!-- 訂單成立成功通知 Modal -->
    <div id="success-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-5 text-center relative">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto shadow-inner">
                <i class="fa-solid fa-check"></i>
            </div>
            <div>
                <h3 class="text-xl font-bold text-slate-900">🎉 訂單成立成功！</h3>
                <p class="text-xs text-slate-500 mt-1">我們已收到您的訂單資料，感謝您的購買！</p>
            </div>

            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                <div class="text-xs text-slate-500 font-bold">您的訂單編號為</div>
                <div id="success-order-no" class="text-xl font-mono font-bold text-indigo-600 select-all tracking-wider">ORD-XXXXX</div>
                <button onclick="copyOrderNo()" id="copy-btn" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 cursor-pointer">
                    <i class="fa-regular fa-copy"></i> <span id="copy-btn-text">一鍵複製訂單編號</span>
                </button>
            </div>

            <div class="bg-emerald-50 border border-emerald-200 p-3.5 rounded-xl text-left text-xs text-emerald-900 space-y-1">
                <div class="font-bold flex items-center gap-1.5 text-emerald-800">
                    <i class="fa-brands fa-line text-lg text-emerald-600"></i> 【重要步驟】傳送給官方 LINE
                </div>
                <p class="leading-relaxed">請複製上方訂單編號，並傳送至我們的官方 LINE 帳號，以利我們迅速為您對帳與回覆包裹狀況！</p>
            </div>

            <button onclick="closeSuccessModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold transition text-sm cursor-pointer shadow-md">
                好的，我知道了
            </button>
        </div>
    </div>

    <!-- 新增：圖片放大與左右切換懸浮視窗 (Lightbox Modal) -->
    <div id="image-lightbox-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-2 md:p-6 select-none">
        <!-- 關閉按鈕 -->
        <button onclick="closeImageLightbox()" class="absolute top-4 right-4 text-white/80 hover:text-white bg-slate-800/60 hover:bg-slate-800 w-10 h-10 rounded-full flex items-center justify-center text-xl font-bold transition z-10 cursor-pointer">
            &times;
        </button>

        <!-- 左右切換按鈕 -->
        <button onclick="navigateLightbox(-1)" class="absolute left-2 md:left-6 text-white/90 hover:text-white bg-slate-800/60 hover:bg-slate-800 w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center text-lg md:text-xl font-bold transition z-10 cursor-pointer shadow-lg">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <button onclick="navigateLightbox(1)" class="absolute right-2 md:right-6 text-white/90 hover:text-white bg-slate-800/60 hover:bg-slate-800 w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center text-lg md:text-xl font-bold transition z-10 cursor-pointer shadow-lg">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <!-- 主圖預覽區域 -->
        <div class="max-w-4xl w-full max-h-[85vh] flex flex-col items-center justify-center p-2">
            <img id="lightbox-img" src="" class="max-w-full max-h-[75vh] object-contain rounded-xl shadow-2xl border border-slate-700/50 bg-slate-900/40">
            <div id="lightbox-counter" class="text-white/80 text-xs md:text-sm font-bold mt-3 bg-slate-800/80 px-3 py-1 rounded-full border border-slate-700">
                1 / 1
            </div>
        </div>
    </div>

    <!-- 前台邏輯與 Firebase 串接 -->
    <script type="module">
        import * as FirebaseApp from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import * as Firestore from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBprY_kKxxx7pPC_7yeyoJw8yacMnpVwMs",
            authDomain: "pigshop.firebaseapp.com",
            projectId: "pigshop",
            storageBucket: "pigshop.firebasestorage.app",
            messagingSenderId: "77868439383",
            appId: "1:77868439383:web:80c696e8863a2cb7c99012",
            measurementId: "G-5Q4R84CS4P"
        };

        const app = FirebaseApp.initializeApp(firebaseConfig);
        const db = Firestore.getFirestore(app);

        let products = [];
        let categories = [];
        let allOrdersCache = [];
        let cart = [];
        let selectedVariants = {};
        let selectedImageIndexes = {};
        let shopQuantities = {};
        let currentCategory = 'all';
        let currentCheckoutStep = 1;
        let createdOrderNo = '';

        // 圖片懸浮大圖視窗變數
        let currentLightboxImages = [];
        let currentLightboxIndex = 0;

        let bankAccounts = [{ name: "中國信託 (822)", account: "1234-5678-9012" }];
        let selectedBankIndex = 0;

        const FALLBACK_IMAGE = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 24 24' fill='none' stroke='%23cbd5e1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='18' height='18' x='3' y='3' rx='2' ry='2'/%3E%3Ccircle cx='9' cy='9' r='2'/%3E%3Cpath d='m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21'/%3E%3C/svg%3E";

        Firestore.onSnapshot(Firestore.collection(db, "categories"), (snapshot) => {
            categories = [];
            snapshot.forEach((d) => categories.push({ id: d.id, ...d.data() }));
            renderShopCategoryTabs();
        });

        Firestore.onSnapshot(Firestore.collection(db, "products"), (snapshot) => {
            products = [];
            snapshot.forEach((d) => {
                const data = d.data();
                if (!data.variants || data.variants.length === 0) {
                    data.variants = [{ name: '標準規格', costJPY: data.costJPY || 0, price: data.price || 0, stock: data.stock || 0 }];
                }

                let images = [];
                if (Array.isArray(data.images) && data.images.length > 0) {
                    images = data.images.filter(img => img && img.trim() !== "");
                } else if (data.image && data.image.trim() !== "") {
                    images = [data.image.trim()];
                }
                data.images = images;

                products.push({ id: d.id, ...data });
                if (selectedVariants[d.id] === undefined) selectedVariants[d.id] = 0;
                if (selectedImageIndexes[d.id] === undefined) selectedImageIndexes[d.id] = 0;
                if (shopQuantities[d.id] === undefined) shopQuantities[d.id] = 1;
            });
            renderShopProducts();
        });

        Firestore.onSnapshot(Firestore.collection(db, "orders"), (snapshot) => {
            allOrdersCache = [];
            snapshot.forEach((d) => allOrdersCache.push({ id: d.id, ...d.data() }));
        });

        Firestore.onSnapshot(Firestore.doc(db, "settings", "bank"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.accounts && data.accounts.length > 0) {
                    bankAccounts = data.accounts;
                } else if (data.name && data.account) {
                    bankAccounts = [{ name: data.name, account: data.account }];
                }
            }
        });

        window.switchFrontView = function(viewName) {
            const shopView = document.getElementById('front-view-shop');
            const queryView = document.getElementById('front-view-query');
            const btnShop = document.getElementById('nav-btn-shop');
            const btnQuery = document.getElementById('nav-btn-query');

            if (viewName === 'shop') {
                shopView.classList.remove('hidden');
                queryView.classList.add('hidden');
                btnShop.className = "text-xs md:text-sm bg-indigo-700 px-3 py-2 rounded-xl transition flex items-center gap-1.5 font-medium cursor-pointer";
                btnQuery.className = "text-xs md:text-sm bg-indigo-800/60 hover:bg-indigo-700 px-3 py-2 rounded-xl transition flex items-center gap-1.5 font-medium cursor-pointer";
            } else {
                shopView.classList.add('hidden');
                queryView.classList.remove('hidden');
                btnShop.className = "text-xs md:text-sm bg-indigo-800/60 hover:bg-indigo-700 px-3 py-2 rounded-xl transition flex items-center gap-1.5 font-medium cursor-pointer";
                btnQuery.className = "text-xs md:text-sm bg-indigo-700 px-3 py-2 rounded-xl transition flex items-center gap-1.5 font-medium cursor-pointer";
            }
        };

        window.filterCategory = function(catName) {
            currentCategory = catName;
            renderShopCategoryTabs();
            renderShopProducts();
        };

        function renderShopCategoryTabs() {
            const container = document.getElementById('shop-category-tabs');
            let html = '<button onclick="window.filterCategory(\'all\')" class="px-4 py-2 rounded-xl text-sm font-bold transition whitespace-nowrap cursor-pointer ' + (currentCategory === 'all' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200') + '">全部商品</button>';
            categories.forEach(c => {
                const isActive = currentCategory === c.name;
                html += '<button onclick="window.filterCategory(\'' + c.name + '\')" class="px-4 py-2 rounded-xl text-sm font-bold transition whitespace-nowrap cursor-pointer ' + (isActive ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200') + '">' + c.name + '</button>';
            });
            container.innerHTML = html;
        }

        window.switchProductImage = function(productId, imgIndex) {
            selectedImageIndexes[productId] = Number(imgIndex);
            renderShopProducts();
        };

        // 開啟懸浮圖片大圖燈箱
        window.openImageLightbox = function(productId) {
            const p = products.find(prod => prod.id === productId);
            if (!p || !p.images || p.images.length === 0) return;

            currentLightboxImages = p.images;
            currentLightboxIndex = selectedImageIndexes[productId] !== undefined ? selectedImageIndexes[productId] : 0;
            updateLightboxDisplay();

            document.getElementById('image-lightbox-modal').classList.remove('hidden');
        };

        window.closeImageLightbox = function() {
            document.getElementById('image-lightbox-modal').classList.add('hidden');
        };

        window.navigateLightbox = function(direction) {
            if (currentLightboxImages.length === 0) return;
            currentLightboxIndex = (currentLightboxIndex + direction + currentLightboxImages.length) % currentLightboxImages.length;
            updateLightboxDisplay();
        };

        function updateLightboxDisplay() {
            document.getElementById('lightbox-img').src = currentLightboxImages[currentLightboxIndex] || FALLBACK_IMAGE;
            document.getElementById('lightbox-counter').textContent = (currentLightboxIndex + 1) + ' / ' + currentLightboxImages.length;
        }

        window.changeVariant = function(productId, variantIndex) {
            selectedVariants[productId] = Number(variantIndex);
            shopQuantities[productId] = 1;
            renderShopProducts();
        };

        window.changeShopQty = function(productId, delta) {
            const prod = products.find(p => p.id === productId);
            if (!prod) return;
            const vIdx = selectedVariants[productId] || 0;
            const currentVar = prod.variants[vIdx];
            let current = shopQuantities[productId] || 1;
            let next = current + delta;
            if (next >= 1 && next <= currentVar.stock) {
                shopQuantities[productId] = next;
                document.getElementById('shop-qty-' + productId).textContent = next;
            }
        };

        window.addToCartFromShop = function(productId) {
            const prod = products.find(p => p.id === productId);
            if (!prod) return;
            const vIdx = selectedVariants[productId] || 0;
            const variant = prod.variants[vIdx];
            if (!variant || variant.stock <= 0) return;

            const qty = shopQuantities[productId] || 1;
            const imgIdx = selectedImageIndexes[productId] || 0;
            const imgSrc = (prod.images && prod.images[imgIdx]) ? prod.images[imgIdx] : FALLBACK_IMAGE;

            const cartItemId = prod.id + '_' + vIdx;
            const existing = cart.find(item => item.cartItemId === cartItemId);

            if (existing) {
                if (existing.quantity + qty <= variant.stock) {
                    existing.quantity += qty;
                } else {
                    existing.quantity = variant.stock;
                    alert('已達該規格最大庫存數量限制');
                }
            } else {
                cart.push({
                    cartItemId,
                    id: prod.id,
                    variantIndex: vIdx,
                    name: prod.name,
                    variantName: variant.name,
                    price: variant.price,
                    costJPY: variant.costJPY || 0,
                    quantity: qty,
                    maxStock: variant.stock,
                    image: imgSrc
                });
            }
            updateCartBadge();
            alert('已將【' + prod.name + ' - ' + variant.name + '】x ' + qty + ' 加入購物車！');
        };

        function updateCartBadge() {
            document.getElementById('cart-badge').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
        }

        window.renderShopProducts = function() {
            const grid = document.getElementById('shop-product-grid');
            let filtered = products;
            if (currentCategory !== 'all') {
                filtered = products.filter(p => p.category === currentCategory);
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400">此分類目前尚無商品。</div>';
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const images = (p.images && p.images.length > 0) ? p.images : [FALLBACK_IMAGE];
                const activeImgIdx = selectedImageIndexes[p.id] !== undefined && selectedImageIndexes[p.id] < images.length ? selectedImageIndexes[p.id] : 0;
                const currentImgSrc = images[activeImgIdx];

                const vIdx = selectedVariants[p.id] || 0;
                const currentVar = p.variants[vIdx] || p.variants[0];
                const currentQty = shopQuantities[p.id] || 1;

                let thumbnailsHtml = '';
                if (images.length > 1) {
                    thumbnailsHtml = '<div class="flex justify-center items-center gap-1.5 p-2 bg-slate-50 border-t overflow-x-auto">' +
                        images.map((img, idx) => 
                            '<button onclick="window.switchProductImage(\'' + p.id + '\', ' + idx + ')" class="w-7 h-7 rounded-lg overflow-hidden border-2 transition cursor-pointer ' + (idx === activeImgIdx ? 'border-indigo-600 scale-105 shadow-sm' : 'border-transparent opacity-60 hover:opacity-100') + '">' +
                                '<img src="' + img + '" class="w-full h-full object-cover">' +
                            '</button>'
                        ).join('') +
                    '</div>';
                }

                return '<div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col justify-between">' +
                    '<div>' +
                        '<!-- 卡片圖片改為 object-contain 並點擊可開啟懸浮視窗 -->' +
                        '<div onclick="window.openImageLightbox(\'' + p.id + '\')" class="h-56 bg-slate-100 overflow-hidden relative flex items-center justify-center group cursor-zoom-in p-2" title="點擊放大檢視大圖/尺寸表">' +
                            '<img src="' + currentImgSrc + '" alt="' + p.name + '" class="max-w-full max-h-full object-contain transition-all duration-300 group-hover:scale-105">' +
                            '<div class="absolute bottom-2 right-2 bg-slate-900/60 text-white text-[10px] px-2 py-0.5 rounded-md flex items-center gap-1 opacity-80 group-hover:opacity-100 transition">' +
                                '<i class="fa-solid fa-magnifying-glass-plus"></i> 點擊放大' +
                            '</div>' +
                            (currentVar.stock === 0 ? '<div class="absolute inset-0 bg-slate-900/40 flex items-center justify-center text-white font-bold text-lg">此規格已售完</div>' : '') +
                        '</div>' +
                        thumbnailsHtml +
                        '<div class="p-4 space-y-2">' +
                            '<span class="text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-md font-medium">' + (p.category || '未分類') + '</span>' +
                            '<h3 class="font-bold text-slate-800 text-base mt-1">' + p.name + '</h3>' +
                            '<div>' +
                                '<label class="block text-[11px] font-bold text-slate-500 mb-1">選擇款式 / 規格：</label>' +
                                '<select onchange="window.changeVariant(\'' + p.id + '\', this.value)" class="w-full px-2.5 py-1.5 border rounded-lg text-xs bg-slate-50 focus:ring-1 focus:ring-indigo-500 focus:outline-none">' +
                                    p.variants.map((v, i) => '<option value="' + i + '" ' + (i === vIdx ? 'selected' : '') + '>' + v.name + ' (庫存:' + v.stock + ')</option>').join('') +
                                '</select>' +
                            '</div>' +
                            '<div class="text-rose-600 font-bold text-lg">NT$ ' + currentVar.price.toLocaleString() + '</div>' +
                            '<div class="text-xs text-slate-400">規格庫存: ' + currentVar.stock + ' 件</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="p-4 pt-0 space-y-3">' +
                        (currentVar.stock > 0 ? 
                            '<div class="flex items-center justify-between bg-slate-50 p-2 rounded-xl border">' +
                                '<span class="text-xs text-slate-600 font-medium">數量</span>' +
                                '<div class="flex items-center gap-3">' +
                                    '<button onclick="window.changeShopQty(\'' + p.id + '\', -1)" class="w-7 h-7 bg-white border rounded-lg font-bold shadow-sm hover:bg-slate-100 cursor-pointer">-</button>' +
                                    '<span id="shop-qty-' + p.id + '" class="text-sm font-bold w-6 text-center">' + currentQty + '</span>' +
                                    '<button onclick="window.changeShopQty(\'' + p.id + '\', 1)" class="w-7 h-7 bg-white border rounded-lg font-bold shadow-sm hover:bg-slate-100 cursor-pointer">+</button>' +
                                '</div>' +
                            '</div>' +
                            '<button onclick="window.addToCartFromShop(\'' + p.id + '\')" class="w-full bg-indigo-600 text-white py-2 rounded-xl text-sm font-medium hover:bg-indigo-700 transition cursor-pointer">加入購物車</button>'
                            : '<button disabled class="w-full bg-slate-200 text-slate-400 py-2 rounded-xl text-sm font-medium cursor-not-allowed">規格售完</button>'
                        ) +
                    '</div>' +
                '</div>';
            }).join('');
        };

        window.queryOrders = function() {
            const rawInput = document.getElementById('query-order-nos').value;
            const container = document.getElementById('query-result-container');
            if (!rawInput.trim()) {
                container.innerHTML = '<div class="text-sm text-rose-500 bg-white p-4 rounded-xl border">請先輸入至少一筆訂單流水號。</div>';
                return;
            }

            const searchNos = rawInput.split(/[\n,\s]+/).map(s => s.trim()).filter(s => s.length > 0);
            const foundOrders = allOrdersCache.filter(o => searchNos.includes(o.orderNo));

            if (foundOrders.length === 0) {
                container.innerHTML = '<div class="text-sm text-slate-500 bg-white p-4 rounded-xl border">查無符合的訂單資料，請確認流水號是否正確。</div>';
                return;
            }

            container.innerHTML = '<div class="space-y-3">' +
                '<div class="text-xs font-bold text-slate-600">查詢結果共找到 ' + foundOrders.length + ' 筆訂單：</div>' +
                '<div class="divide-y border rounded-2xl overflow-hidden bg-white shadow-sm">' +
                    foundOrders.map(o => 
                        '<div class="p-4 space-y-2">' +
                            '<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-1">' +
                                '<div>' +
                                    '<span class="font-bold text-indigo-600 text-base">' + o.orderNo + '</span>' +
                                    '<span class="text-xs text-slate-400 ml-2">' + new Date(o.createdAt).toLocaleString() + '</span>' +
                                '</div>' +
                                '<span class="text-xs px-2.5 py-1 rounded-full font-bold bg-indigo-100 text-indigo-700">' + o.status + '</span>' +
                            '</div>' +
                            '<div class="text-xs text-slate-600 space-y-1">' +
                                '<div><strong>購買內容：</strong> ' + o.items.map(i => i.name + ' (' + i.variantName + ') x ' + i.quantity).join(', ') + '</div>' +
                                '<div><strong>總金額：</strong> NT$ ' + o.totalAmount.toLocaleString() + '</div>' +
                                '<div><strong>包裹重量：</strong> <span class="text-indigo-700 font-bold text-sm">' + (o.weight !== undefined && o.weight !== '' ? o.weight + ' kg' : '尚未測量/登錄') + '</span></div>' +
                            '</div>' +
                        '</div>'
                    ).join('') +
                '</div>' +
            '</div>';
        };

        window.openCartModal = function() {
            currentCheckoutStep = 1;
            selectedBankIndex = 0;
            renderCartModalContent();
            document.getElementById('cart-modal').classList.remove('hidden');
        };

        window.closeCartModal = function() {
            document.getElementById('cart-modal').classList.add('hidden');
        };

        window.goToCheckoutStep2 = function() {
            currentCheckoutStep = 2;
            renderCartModalContent();
        };

        window.goToCheckoutStep1 = function() {
            currentCheckoutStep = 1;
            renderCartModalContent();
        };

        window.onBankSelectChange = function(index) {
            selectedBankIndex = Number(index);
            const currentAccount = bankAccounts[selectedBankIndex] || bankAccounts[0];
            const displayEl = document.getElementById('checkout-bank-account-display');
            if (displayEl) {
                displayEl.textContent = currentAccount.account;
            }
        };

        window.renderCartModalContent = function() {
            const body = document.getElementById('cart-modal-body');
            if (cart.length === 0) {
                body.innerHTML = '<div class="text-center py-12 text-slate-400 space-y-3">' +
                    '<i class="fa-solid fa-cart-shopping text-4xl"></i>' +
                    '<p>您的購物車是空的</p>' +
                    '<button onclick="closeCartModal()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm cursor-pointer">返回選購</button>' +
                '</div>';
                return;
            }

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            if (currentCheckoutStep === 1) {
                body.innerHTML = '<div class="space-y-4">' +
                    '<div class="divide-y max-h-60 overflow-y-auto">' +
                        cart.map(item => 
                            '<div class="py-3 flex items-center justify-between gap-3">' +
                                '<img src="' + item.image + '" class="w-12 h-12 rounded-lg object-cover bg-slate-100">' +
                                '<div class="flex-grow">' +
                                    '<div class="font-bold text-sm text-slate-800">' + item.name + '</div>' +
                                    '<div class="text-xs text-indigo-600 font-medium">規格: ' + item.variantName + '</div>' +
                                    '<div class="text-xs text-slate-500">NT$ ' + item.price.toLocaleString() + ' x ' + item.quantity + '</div>' +
                                '</div>' +
                                '<div class="text-sm font-bold text-slate-900">NT$ ' + (item.price * item.quantity).toLocaleString() + '</div>' +
                                '<button onclick="window.removeFromCart(\'' + item.cartItemId + '\')" class="text-rose-500 hover:text-rose-700 p-1 cursor-pointer"><i class="fa-solid fa-trash"></i></button>' +
                            '</div>'
                        ).join('') +
                    '</div>' +
                    '<div class="border-t pt-4 flex justify-between items-center font-bold text-lg">' +
                        '<span>總金額：</span>' +
                        '<span class="text-rose-600">NT$ ' + totalAmount.toLocaleString() + '</span>' +
                    '</div>' +
                    '<button type="button" onclick="window.goToCheckoutStep2()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-medium hover:bg-indigo-700 transition cursor-pointer">前往填寫匯款資訊</button>' +
                '</div>';
            } else if (currentCheckoutStep === 2) {
                const defaultBank = bankAccounts[selectedBankIndex] || bankAccounts[0];

                body.innerHTML = '<form onsubmit="window.submitOrder(event)" class="space-y-4">' +
                    '<div class="bg-indigo-50 p-4 rounded-xl text-sm space-y-2 text-indigo-900 border border-indigo-100">' +
                        '<div class="font-bold"><i class="fa-solid fa-circle-info"></i> 匯款指示與注意事項</div>' +
                        '<p>請選取欲轉入的銀行，將款項匯至指定帳號並完成回報：</p>' +
                        '<div class="bg-white p-3 rounded-lg border border-indigo-200 space-y-1.5">' +
                            '<div><strong>收款帳號：</strong> <span id="checkout-bank-account-display" class="font-bold text-indigo-700 text-base">' + defaultBank.account + '</span></div>' +
                            '<div><strong>應付總金額：</strong> <span class="text-rose-600 font-bold">NT$ ' + totalAmount.toLocaleString() + '</span></div>' +
                        '</div>' +
                        '<div class="bg-amber-50 border border-amber-200 p-2.5 rounded-lg text-amber-800 text-xs leading-relaxed flex gap-2 items-start mt-2">' +
                            '<i class="fa-brands fa-line text-emerald-600 text-base flex-shrink-0 mt-0.5"></i>' +
                            '<div><strong>重要提醒：</strong>訂單送出後，請將「訂單編號」傳送至我們的<strong>官方 LINE</strong>，以方便快速為您對帳與回覆包裹狀況！</div>' +
                        '</div>' +
                    '</div>' +
                    '<div>' +
                        '<label class="block text-sm font-medium text-slate-600 mb-1">選擇轉入銀行帳號</label>' +
                        '<select id="pay-bank-select" onchange="window.onBankSelectChange(this.value)" required class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">' +
                            bankAccounts.map((b, i) => '<option value="' + i + '" ' + (i === selectedBankIndex ? 'selected' : '') + '>' + b.name + '</option>').join('') +
                        '</select>' +
                    '</div>' +
                    '<div>' +
                        '<label class="block text-sm font-medium text-slate-600 mb-1">匯款金額 (NT$)</label>' +
                        '<input type="number" id="pay-amount" value="' + totalAmount + '" required class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">' +
                    '</div>' +
                    '<div>' +
                        '<label class="block text-sm font-medium text-slate-600 mb-1">匯款時間</label>' +
                        '<input type="datetime-local" id="pay-time" required class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">' +
                    '</div>' +
                    '<div>' +
                        '<label class="block text-sm font-medium text-slate-600 mb-1">帳號後五碼 / 匯款人姓名</label>' +
                        '<input type="text" id="pay-account-suffix" placeholder="例如: 54321 / 王小明" required class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">' +
                    '</div>' +
                    '<div class="flex gap-2 pt-2">' +
                        '<button type="button" onclick="window.goToCheckoutStep1()" class="w-1/3 bg-slate-100 text-slate-600 py-2.5 rounded-xl font-medium hover:bg-slate-200 cursor-pointer">回上一步</button>' +
                        '<button type="submit" class="w-2/3 bg-indigo-600 text-white py-2.5 rounded-xl font-medium hover:bg-indigo-700 cursor-pointer">確認送出訂單</button>' +
                    '</div>' +
                '</form>';
            }
        };

        window.removeFromCart = function(cartItemId) {
            cart = cart.filter(i => i.cartItemId !== cartItemId);
            updateCartBadge();
            renderCartModalContent();
        };

        window.copyOrderNo = function() {
            if (!createdOrderNo) return;
            navigator.clipboard.writeText(createdOrderNo).then(() => {
                const btnText = document.getElementById('copy-btn-text');
                const btn = document.getElementById('copy-btn');
                btnText.textContent = '已複製成功！';
                btn.classList.remove('bg-slate-200', 'text-slate-700');
                btn.classList.add('bg-emerald-600', 'text-white');
                
                setTimeout(() => {
                    btnText.textContent = '一鍵複製訂單編號';
                    btn.classList.remove('bg-emerald-600', 'text-white');
                    btn.classList.add('bg-slate-200', 'text-slate-700');
                }, 2000);
            }).catch(err => {
                alert('複製失敗，請手動選取複製：' + createdOrderNo);
            });
        };

        window.closeSuccessModal = function() {
            document.getElementById('success-modal').classList.add('hidden');
        };

        window.submitOrder = async function(e) {
            e.preventDefault();
            const bankIdx = Number(document.getElementById('pay-bank-select').value);
            const selectedBank = bankAccounts[bankIdx] || bankAccounts[0];

            const amount = document.getElementById('pay-amount').value;
            const time = document.getElementById('pay-time').value;
            const suffix = document.getElementById('pay-account-suffix').value;

            const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const randomCode = Math.floor(1000 + Math.random() * 9000);
            const orderNo = 'ORD-' + dateStr + '-' + randomCode;
            createdOrderNo = orderNo;
            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const orderData = {
                orderNo,
                createdAt: new Date().toISOString(),
                items: cart,
                totalAmount,
                payment: { 
                    bank: selectedBank.name, 
                    bankAccount: selectedBank.account, 
                    amount: Number(amount), 
                    time, 
                    suffix 
                },
                status: '待查帳',
                weight: ''
            };

            try {
                await Firestore.addDoc(Firestore.collection(db, "orders"), orderData);

                for (const item of cart) {
                    const prod = products.find(p => p.id === item.id);
                    if (prod && prod.variants && prod.variants[item.variantIndex]) {
                        const updatedVariants = [...prod.variants];
                        updatedVariants[item.variantIndex].stock = Math.max(0, updatedVariants[item.variantIndex].stock - item.quantity);
                        await Firestore.updateDoc(Firestore.doc(db, "products", prod.id), { variants: updatedVariants });
                    }
                }

                cart = [];
                updateCartBadge();
                closeCartModal();

                document.getElementById('success-order-no').textContent = orderNo;
                document.getElementById('success-modal').classList.remove('hidden');

            } catch (err) {
                console.error("訂單送出失敗:", err);
                alert("送出訂單發生錯誤，請稍後再試。");
            }
        };
    </script>
</body>
</html>
